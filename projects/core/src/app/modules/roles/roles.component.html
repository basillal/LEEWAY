<div style="max-height: 450px; overflow-y: auto; padding: 1rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; box-shadow: 0 1px 3px #00000014;">
    <h3 class="font-semibold mb-2">Inline Example</h3>
    <lib-dynamic-form
      [inputConfig]="formFields"
      [formData]="editData"
      [isEditMode]="isEditMode"
      (submitForm)="handleFormSubmit($event)"
      (formStatus)="handleFormStatus($event)"
    ></lib-dynamic-form>
  </div>
