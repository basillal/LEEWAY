<form *ngIf="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
    <ng-container *ngFor="let input of inputConfig; trackBy: trackByKey">
      <div *ngIf="shouldShow(input)" [class]="input.wrapperClassName || 'col-span-2'">
        <label [for]="input.key" class="block text-xs font-semibold text-gray-700 mb-1">
          {{ input.label }}
          <span *ngIf="input.tooltip" class="text-xs text-gray-400 ml-1" title="{{ input.tooltip }}">?</span>
        </label>

        <ng-container [ngSwitch]="input.type">
          <!-- Text, Number, Email, Date, Tel, Password -->
          <input *ngSwitchCase="'text'"
                 [id]="input.key"
                 type="text"
                 [formControlName]="input.key"
                 [placeholder]="input.placeholder"
                 [ngClass]="input.className || 'bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5'"
                 [attr.aria-invalid]="ariaInvalid(input.key)" />
          <input *ngSwitchCase="'number'"
                 [id]="input.key"
                 type="number"
                 [formControlName]="input.key"
                 [placeholder]="input.placeholder"
                 [ngClass]="input.className || 'bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5'"
                 [attr.aria-invalid]="ariaInvalid(input.key)" />
          <input *ngSwitchCase="'email'"
                 [id]="input.key"
                 type="email"
                 [formControlName]="input.key"
                 [placeholder]="input.placeholder"
                 [ngClass]="input.className || 'bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5'"
                 [attr.aria-invalid]="ariaInvalid(input.key)" />
          <input *ngSwitchCase="'date'"
                 [id]="input.key"
                 type="date"
                 [formControlName]="input.key"
                 [placeholder]="input.placeholder"
                 [ngClass]="input.className || 'bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5'"
                 [attr.aria-invalid]="ariaInvalid(input.key)" />
          <input *ngSwitchCase="'tel'"
                 [id]="input.key"
                 type="tel"
                 [formControlName]="input.key"
                 [placeholder]="input.placeholder"
                 [ngClass]="input.className || 'bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5'"
                 [attr.aria-invalid]="ariaInvalid(input.key)" />
          <input *ngSwitchCase="'password'"
                 [id]="input.key"
                 type="password"
                 [formControlName]="input.key"
                 [placeholder]="input.placeholder"
                 [ngClass]="input.className || 'bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5'"
                 [attr.aria-invalid]="ariaInvalid(input.key)" />

          <!-- Textarea -->
          <textarea *ngSwitchCase="'textarea'"
                    [id]="input.key"
                    [formControlName]="input.key"
                    [placeholder]="input.placeholder"
                    [ngClass]="input.className || 'bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5'"
                    [attr.aria-invalid]="ariaInvalid(input.key)"></textarea>

          <!-- Select -->
          <select *ngSwitchCase="'select'"
                  [id]="input.key"
                  [formControlName]="input.key"
                  [attr.multiple]="input.multiple ? true : null"
                  [ngClass]="input.className || 'bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5'"
                  [attr.aria-invalid]="ariaInvalid(input.key)">
            <option *ngIf="!input.multiple" disabled value="">{{ input.placeholder || ('Select ' + (input.label || input.key)) }}</option>
            <ng-container *ngIf="input.options">
              <option *ngFor="let opt of input.options" [value]="opt.value">{{ opt.label }}</option>
            </ng-container>
            <ng-container *ngIf="input.asyncOptions">
              <option *ngFor="let opt of (getOptions$(input.key) | async)" [value]="opt.value">{{ opt.label }}</option>
            </ng-container>
          </select>

          <!-- Radio -->
          <div *ngSwitchCase="'radio'">
            <ng-container *ngFor="let o of (input.options || (getOptions$(input.key) | async))">
              <label class="inline-flex items-center mr-3">
                <input [formControlName]="input.key" type="radio" [value]="o.value" />
                <span class="ml-2">{{ o.label }}</span>
              </label>
            </ng-container>
          </div>

          <!-- Checkbox -->
          <div *ngSwitchCase="'checkbox'" class="flex items-center">
            <input [id]="input.key" type="checkbox" [formControlName]="input.key"
                   [ngClass]="input.className || 'h-4 w-4 text-blue-600 border-gray-300 rounded'"
                   [attr.aria-invalid]="ariaInvalid(input.key)" />
            <label class="ml-2 block text-xs text-gray-700" [for]="input.key">{{ input.label }}</label>
          </div>

          <!-- File -->
          <input *ngSwitchCase="'file'" [id]="input.key" type="file" [attr.accept]="input.accept"
                 (change)="getControl(input.key)?.setValue($event.target.files)"
                 [ngClass]="input.className || 'bg-gray-50 border border-gray-300 rounded block w-full p-2.5'"
                 [attr.aria-invalid]="ariaInvalid(input.key)" />

          <!-- Group -->
          <div *ngSwitchCase="'group'" [formGroupName]="input.key" class="space-y-2">
            <ng-container *ngFor="let f of input.fields">
              <div [class]="f.wrapperClassName || 'col-span-2'">
                <label class="block text-xs font-semibold mb-1">{{ f.label }}</label>
                <input *ngIf="['text','number','email','date','tel','password'].includes(f.type)"
                  [formControlName]="f.key" [placeholder]="f.placeholder" class="bg-gray-50 border p-2.5 rounded w-full" />
                <div *ngIf="isInvalid(f.key)" class="text-red-500 text-xs mt-1">{{ getErrorMessage(f) }}</div>
              </div>
            </ng-container>
          </div>

          <!-- Array -->
          <div *ngSwitchCase="'array'">
            <div [formArrayName]="input.key" class="space-y-3">
              <ng-container *ngIf="getFormArray(input.key) as arr">
                <div *ngFor="let ctrl of arr.controls; let i = index" class="flex items-start space-x-2 mb-2">
                  <ng-container *ngIf="isFormGroup(arr.at(i)); then groupTpl else controlTpl"></ng-container>
                  <ng-template #groupTpl>
                    <div [formGroupName]="i" class="flex-1">
                      <ng-container *ngFor="let f of input.fields">
                        <label class="block text-xs font-semibold">{{ f.label }}</label>
                        <input *ngIf="['text','number','email'].includes(f.type)"
                          [formControlName]="f.key" class="bg-gray-50 border p-2.5 rounded w-full mb-1" />
                        <div *ngIf="isInvalid(f.key)" class="text-red-500 text-xs mt-1">{{ getErrorMessage(f) }}</div>
                      </ng-container>
                    </div>
                  </ng-template>
                  <ng-template #controlTpl>
                    <div class="flex-1">
                      <input [formControlName]="i" class="bg-gray-50 border p-2.5 rounded w-full mb-1" />
                      <div *ngIf="isInvalid(i)" class="text-red-500 text-xs mt-1">{{ getErrorMessage(input.fields[0]) }}</div>
                    </div>
                  </ng-template>
                  <button type="button" class="text-red-600" (click)="removeArrayItem(input.key, i)" [disabled]="input.minItems && (arr.length || 0) <= input.minItems">Remove</button>
                </div>
                <div *ngIf="isInvalid(input.key)" class="text-red-500 text-xs mt-1">{{ getErrorMessage(input) }}</div>
                <button type="button" class="text-blue-700" (click)="addArrayItem(input.key)" [disabled]="input.maxItems && (arr.length || 0) >= input.maxItems">Add</button>
              </ng-container>
            </div>
          </div>
        </ng-container>
        
        <!-- Single Validation per element (except for group/array, handled inside their blocks above) -->
        <div *ngIf="isInvalid(input.key) && !['group','array'].includes(input.type)" class="text-red-500 text-xs mt-1">
          {{ getErrorMessage(input) }}
        </div>
      </div>
    </ng-container>
  </div>
  <div class="flex flex-col sm:flex-row justify-end mt-6 space-y-2 sm:space-y-0 sm:space-x-2">
    <button type="button" (click)="onReset()" class="bg-gray-300 text-xs px-6 py-2 rounded hover:bg-gray-400 transition">Reset</button>
    <button type="submit" [disabled]="(disableSubmitUntilValid && form.invalid) || submitting" class="bg-blue-800 text-white text-xs font-medium px-6 py-2 rounded hover:bg-blue-900 transition" *ngIf="!isEditMode">{{ submitButtonLabel }}</button>
    <button type="submit" [disabled]="(disableSubmitUntilValid && form.invalid) || submitting" class="bg-green-800 text-white text-xs font-medium px-6 py-2 rounded hover:bg-green-900 transition" *ngIf="isEditMode">{{ updateButtonLabel }}</button>
  </div>
</form>
